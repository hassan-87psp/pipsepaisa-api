name: Economic Calendar Rolling Weekly Sync Audit

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/calendar.js'
      - 'scripts/calendar-week-parity.cjs'
      - 'scripts/calendar-nextweek-snapshot.cjs'
      - 'scripts/live-calendar-frontend-smoke.cjs'
      - 'tests/calendar-week-sync.test.cjs'
      - 'tests/calendar-html-nextweek.test.cjs'
      - 'tests/calendar-integrity.test.cjs'
      - '.github/workflows/economic-calendar-weekly-sync.yml'

permissions:
  contents: write
  issues: write

jobs:
  calendar-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Calendar source and DST unit tests
        run: npm test
      - name: Compare deployed calendar with both Forex Factory weekly exports
        run: node scripts/calendar-week-parity.cjs
      - name: Read-only production frontend calendar smoke
        if: always()
        run: node scripts/live-calendar-frontend-smoke.cjs
      - name: Refresh verified next-week Forex Factory snapshot
        if: always()
        run: |
          node scripts/calendar-nextweek-snapshot.cjs
          if [ -f data/ff-nextweek-snapshot.json ]; then
            git add data/ff-nextweek-snapshot.json
            if ! git diff --cached --quiet; then
              git -c user.name="pipsepaisa-calendar-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh verified Forex Factory next-week snapshot"
              git push origin HEAD:main
            fi
          fi
      - name: Keep next-week source blocker in issue #2 (at most one comment daily)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -f calendar-parity-last.json ] && node -e 'const r=require("./calendar-parity-last.json");process.exit(r.weeks.nextweek?.status!=="published"?0:1)'; then
            gh issue reopen 2 2>/dev/null || true
            day="$(date -u +%F)"
            last="$(gh issue view 2 --json comments --jq '[.comments[].body] | last // ""' || true)"
            if [[ "$last" != *"Auto-check $day:"* ]]; then
              gh issue comment 2 --body "Auto-check $day: Next-week exact Forex Factory data remains unverified (dated HTML blocked or weekly JSON unavailable). Current source fallback is still clearly labelled. Check: $RUN_LINK"
            fi
          else
            title="Economic Calendar automatic parity failure"
            existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
            body="An automatic economic calendar check failed. See workflow: $RUN_LINK"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          fi
