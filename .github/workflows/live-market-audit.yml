name: Live Market Data Smoke Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-market-audit.cjs'
      - 'api/news.js'
      - 'api/calendar.js'
      - '.github/workflows/live-market-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check live calendar and headline sources
        run: node scripts/live-market-audit.cjs
